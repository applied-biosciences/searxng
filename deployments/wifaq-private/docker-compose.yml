services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes: [./settings.yml:/etc/searxng/settings.yml:ro]
    networks: [search_internal]
  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      SEARXNG_URL: http://searxng:8080
      WIFAQ_SEARCH_TOKEN: $${WIFAQ_SEARCH_TOKEN}
      MAX_RESULTS: "20"
      REQUEST_TIMEOUT_SECONDS: "10"
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [searxng]
    networks: [search_internal]
networks:
  search_internal:
    internal: true
